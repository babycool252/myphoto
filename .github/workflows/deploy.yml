name: Deploy ATELIER
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Assemble public gallery
        run: |
          mkdir -p _site
          cp index.html app.js style.css gallery.json _site/
          shopt -s nullglob
          for archive in atelier-images-*.zip; do
            unzip -q "$archive" -d _site
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('_site')
          for entry in json.loads((root / 'gallery.json').read_text()):
              for key in ('url', 'thumbnail'):
                  path = entry.get(key, '')
                  if path.startswith('images/') and not (root / path).is_file():
                      raise SystemExit(f'Missing gallery image: {path}')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
